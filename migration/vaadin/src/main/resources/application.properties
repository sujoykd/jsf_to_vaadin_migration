logging.level.org.atmosphere=warn

server.servlet.session.timeout=60m

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,br.com.webbudget

# Let Hibernate update the schema automatically or create it if it does not exist.
#
# DO NOT DO THIS IN PRODUCTION!
#
# Instead, use Flyway or another controlled way of managing your database schema.
# See https://vaadin.com/docs/latest/building-apps/forms-data/add-flyway for instructions.
spring.jpa.hibernate.ddl-auto=none

# --- migration: run alongside the JSF app, same database -------------------
server.port=${PORT:8090}
spring.datasource.url=${DB_URL:jdbc:postgresql://192.168.2.126:5432/webbudget}
spring.datasource.username=${DB_USER:sa_webbudget}
spring.datasource.password=${DB_PASSWORD:sa_webbudget}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# reuse the existing Flyway migrations (copied under db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=configuration,registration,financial,journal
# Hibernate Envers (auditing) — same settings as the JSF app
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
# Flyway migration uses legacy Envers column names (revision/revision_type not rev/revtype)
spring.jpa.properties.org.hibernate.envers.revision_field_name=revision
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revision_type
# Disable H2 console — not used in the migration target (postgres only)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration
